[package]
name = "better-notion"
version = "0.1.0"
edition = "2024"
description = "CLI for the Better Notion MCP server"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
colored = "3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3", features = ["json"] }
